services:
  - type: web
    name: kidapt-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn kidapt.wsgi"
    autoDeploy: true

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: kidapt.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
