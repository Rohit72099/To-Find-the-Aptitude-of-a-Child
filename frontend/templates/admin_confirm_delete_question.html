{% extends "base.html" %}

{% block title %}Confirm Delete - Admin{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="margin-top:2rem;">
        <h2 style="color:var(--danger);">Confirm Delete</h2>
        <p>Are you sure you want to delete this question?</p>
        <div class="card">
            <strong>Question:</strong>
            <p>{{ question.text }}</p>
            <p><strong>Section:</strong> {{ question.section.title if question.section }}</p>
        </div>
        <form method="post" style="margin-top:1rem;">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary" style="background:var(--danger); border-color:var(--danger);">Delete</button>
            <a href="{% if question.section %}{% url 'assessments-admin-add-question' assessment_id=question.section.assessment.id %}{% else %}{% url 'assessments-admin-add' %}{% endif %}" class="btn btn-outline" style="margin-left:0.5rem;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
